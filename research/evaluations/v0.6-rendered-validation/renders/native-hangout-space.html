<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hangout Space — native render</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--canvas:#121521;--surface:#1C2030;--ink:#F2F3F8;--muted:#A6ABBF;--line:#2E3347;--action:#FFB547;--on-action:#121521;}
*{box-sizing:border-box;}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:Nunito,sans-serif;height:100vh;position:relative;overflow:hidden;}
.world{position:absolute;inset:0;background:radial-gradient(circle at 30% 70%,#2a2f55,transparent 50%),radial-gradient(circle at 70% 30%,#3a2f55,transparent 50%),var(--canvas);}
.avatar{position:absolute;width:56px;height:56px;border-radius:50%;background:#5B6BE0;bottom:38%;left:44%;box-shadow:0 0 0 4px rgba(91,107,224,.3);animation:bob 3s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
.shield{position:absolute;top:20px;right:20px;background:rgba(28,32,48,.8);backdrop-filter:blur(6px);width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;border:1px solid var(--line);}
.panel{position:absolute;bottom:20px;left:20px;background:rgba(28,32,48,.8);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:16px;padding:14px;width:240px;transition:transform .2s ease;}
.panel h2{font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);margin:0 0 8px;}
.friend{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px;}
.dot{width:8px;height:8px;border-radius:50%;background:#4ADE80;}
.msg{background:rgba(255,255,255,.08);border-radius:10px;padding:8px 10px;font-size:12px;margin-top:6px;}
</style>
</head>
<body>
<div class="world"><div class="avatar"></div></div>
<div class="shield" title="Safety shield">🛡</div>
<div class="panel">
  <h2>Friends here</h2>
  <div class="friend"><span class="dot"></span>Maya</div>
  <div class="friend"><span class="dot"></span>Deshawn</div>
  <div class="msg" id="chat">Deshawn: over by the fountain →</div>
</div>
<script>
setTimeout(function(){document.getElementById('chat').textContent='Maya: lol ok coming';},2000);
</script>
</body>
</html>
