<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pantry List — native render</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--canvas:#F4F7EF;--surface:#FFFFFF;--ink:#1C2418;--muted:#50604A;--line:#D2DCC8;--action:#2F6B1F;--on-action:#FFFFFF;}
*{box-sizing:border-box;}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:Rubik,sans-serif;font-size:15px;}
.tabbar{display:flex;justify-content:space-around;padding:14px 0;background:var(--surface);border-bottom:1px solid var(--line);font-size:13px;color:var(--muted);}
.tabbar .active{color:var(--action);font-weight:700;}
.aisle{padding:12px 20px 4px;font-weight:700;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.02em;}
.aisle-block{background:#EAF2E1;}
.item{display:flex;align-items:center;gap:14px;padding:10px 20px;height:64px;border-bottom:1px solid var(--line);}
.item img{width:44px;height:44px;border-radius:12px;background:#ddd;flex-shrink:0;}
.info{flex:1;}
.info .name{font-weight:500;}
.info .size{font-size:12px;color:var(--muted);}
.price{font-weight:700;font-family:Rubik;}
.stepper{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:18px;height:36px;padding:0 4px;}
.stepper button{width:28px;height:28px;border-radius:50%;border:none;background:transparent;font-size:16px;color:var(--action);cursor:pointer;}
.basket{position:sticky;bottom:0;background:var(--action);color:var(--on-action);display:flex;justify-content:space-between;align-items:center;padding:14px 20px;font-weight:700;}
.fly{position:fixed;width:24px;height:24px;border-radius:6px;background:#ddd;transition:all .25s ease;pointer-events:none;}
</style>
</head>
<body>
<div class="tabbar"><div class="active">Shop</div><div>Search</div><div>Orders</div><div>Account</div></div>
<div class="aisle aisle-block">Buy again</div>
<div class="item">
  <img id="thumb1" src="">
  <div class="info"><div class="name">Whole milk</div><div class="size">1L · $0.29/100ml</div></div>
  <div class="price">$2.90</div>
  <div class="stepper"><button id="minus1">–</button><span id="qty1">1</span><button id="plus1">+</button></div>
</div>
<div class="item">
  <img src="">
  <div class="info"><div class="name">Sourdough loaf</div><div class="size">600g</div></div>
  <div class="price">$4.50</div>
  <div class="stepper"><button>–</button><span>0</span><button>+</button></div>
</div>
<div class="aisle">Produce</div>
<div class="item">
  <img src="">
  <div class="info"><div class="name">Bananas</div><div class="size">per kg · $1.20/kg</div></div>
  <div class="price">$0.84</div>
  <div class="stepper"><button>–</button><span>0</span><button>+</button></div>
</div>
<div class="basket"><span>Basket · 3 items</span><span>$12.30</span></div>
<script>
var qty=1;
document.getElementById('plus1').addEventListener('click',function(){
  qty++;document.getElementById('qty1').textContent=qty;
  var img=document.getElementById('thumb1');
  var r=img.getBoundingClientRect();
  var fly=document.createElement('div');
  fly.className='fly';
  fly.style.left=r.left+'px';fly.style.top=r.top+'px';
  document.body.appendChild(fly);
  requestAnimationFrame(function(){
    fly.style.left='calc(100% - 60px)';
    fly.style.top='calc(100% - 40px)';
    fly.style.opacity='0';
  });
  setTimeout(function(){fly.remove();},300);
});
document.getElementById('minus1').addEventListener('click',function(){
  qty=Math.max(0,qty-1);document.getElementById('qty1').textContent=qty;
});
</script>
</body>
</html>
