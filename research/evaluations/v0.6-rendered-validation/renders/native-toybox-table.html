<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Toybox Table — native render</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--canvas:#FFF4DC;--surface:#FFFFFF;--ink:#231A12;--muted:#5E4E3E;--line:#231A12;--action:#C2410C;--on-action:#FFFFFF;}
*{box-sizing:border-box;}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:"Baloo 2",sans-serif;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.code{font-size:64px;font-weight:700;letter-spacing:.1em;background:var(--surface);border:3px solid var(--ink);border-radius:20px;box-shadow:4px 4px 0 var(--ink);padding:16px 40px;margin-bottom:32px;}
.players{display:flex;gap:16px;margin-bottom:40px;}
.chip{padding:10px 20px;border:3px solid var(--ink);border-radius:20px;font-weight:700;box-shadow:4px 4px 0 var(--ink);opacity:0;animation:pop .5s ease forwards;}
.chip:nth-child(1){background:#FFD166;animation-delay:.1s;}
.chip:nth-child(2){background:#EF476F;color:#fff;animation-delay:.3s;}
.chip:nth-child(3){background:#06D6A0;animation-delay:.5s;}
.chip.waiting{background:var(--surface);color:var(--muted);border-style:dashed;opacity:1;animation:none;}
@keyframes pop{0%{opacity:0;transform:scale(.4) translateY(20px);}70%{opacity:1;transform:scale(1.08);}100%{opacity:1;transform:scale(1);}}
.ready{font-size:24px;padding:16px 48px;background:var(--action);color:var(--on-action);border:3px solid var(--ink);border-radius:20px;box-shadow:4px 4px 0 var(--ink);font-weight:700;cursor:pointer;}
.hint{margin-top:16px;color:var(--muted);font-size:15px;}
</style>
</head>
<body>
<div class="code">7 4 K 2</div>
<div class="players">
  <div class="chip">Fox</div>
  <div class="chip">Otter</div>
  <div class="chip">Badger</div>
  <div class="chip waiting">waiting…</div>
</div>
<button class="ready" id="ready">I'm ready!</button>
<div class="hint" id="hint">Waiting for 1 more player…</div>
<script>
document.getElementById('ready').addEventListener('click',function(){
  this.textContent='Ready ✓';
  document.getElementById('hint').textContent='3 of 4 ready';
});
</script>
</body>
</html>
