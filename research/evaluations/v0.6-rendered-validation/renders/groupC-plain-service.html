<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Plain Service — controlled render</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--canvas:#FFFFFF;--surface:#F1F3F4;--ink:#111416;--muted:#4C555B;--line:#A7AFB4;--action:#1A4F7A;--on-action:#FFFFFF;--focus:#E8A317;}
*{box-sizing:border-box;}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:"Noto Sans",sans-serif;font-size:19px;}
.wrap{max-width:640px;margin:0 auto;padding:40px 24px;}
.back{font-size:15px;color:var(--action);margin-bottom:16px;text-decoration:underline;cursor:pointer;}
.q{font-weight:700;font-size:28px;margin-bottom:24px;line-height:1.3;}
.opt{display:flex;align-items:center;gap:12px;border:2px solid var(--ink);border-radius:0;height:56px;padding:0 16px;margin-bottom:14px;cursor:pointer;background:var(--surface);}
.opt input{width:20px;height:20px;}
.opt:focus-within{outline:3px solid var(--focus);outline-offset:2px;}
button{font:700 17px "Noto Sans";padding:12px 24px;border-radius:0;border:2px solid var(--ink);background:var(--action);color:var(--on-action);cursor:pointer;}
button:focus{outline:3px solid var(--focus);outline-offset:2px;}
.meta{font-size:14px;color:var(--muted);margin-top:32px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="back">← Back</div>
  <div class="meta" style="margin-top:0;margin-bottom:8px;">Apply for household benefit — question 4 of 9</div>
  <div class="q">Do you have any dependants living with you?</div>
  <label class="opt"><input type="radio" name="q4"> Yes</label>
  <label class="opt"><input type="radio" name="q4" checked> No</label>
  <button id="next">Continue</button>
  <div class="meta">Your answers are saved. You can return to this application later using the link we emailed you.</div>
</div>
<script>
document.getElementById('next').addEventListener('click',function(){
  this.textContent='Continuing…';
});
</script>
</body>
</html>
