<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fixture: template treatments</title>
<style>
 body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(135deg,#7c3aed,#2563eb);min-height:100vh}
 .hero{padding:80px 40px;text-align:center;color:#fff}
 .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.2em;color:#ddd;background:linear-gradient(90deg,#fff3,#fff1);border-radius:999px;padding:4px 10px;display:inline-block}
 .panel{margin:24px auto;max-width:900px;padding:24px;border-radius:32px;background:rgba(255,255,255,.2);backdrop-filter:blur(20px);box-shadow:0 20px 60px rgba(0,0,0,.3)}
 .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
 .card{padding:20px;border-radius:24px;background:rgba(255,255,255,.25);box-shadow:0 8px 24px rgba(0,0,0,.2);color:#fff}
 .card .inner{border-radius:20px;background:rgba(255,255,255,.2);padding:12px;box-shadow:0 2px 6px rgba(0,0,0,.1)}
 .btn{background:linear-gradient(90deg,#f472b6,#8b5cf6);border-radius:999px;color:#fff;padding:12px 24px;border:0}
</style></head>
<body>
 <section class="hero"><span class="eyebrow">Introducing</span><h1>Unlock your potential</h1><button class="btn">Get started</button></section>
 <div class="panel"><span class="eyebrow">Features</span>
  <div class="grid">
   <div class="card"><div class="inner"><span class="eyebrow">Fast</span><p>Seamless</p></div></div>
   <div class="card"><div class="inner"><span class="eyebrow">Smart</span><p>Powerful</p></div></div>
   <div class="card"><div class="inner"><span class="eyebrow">Secure</span><p>Robust</p></div></div>
  </div>
 </div>
</body></html>
