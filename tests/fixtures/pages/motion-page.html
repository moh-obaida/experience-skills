<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Fixture: motion</title>
<style>
 .blob{width:80px;height:80px;background:#8b5cf6;animation:float 3s ease-in-out infinite}
 @keyframes float{from{transform:translateY(0)}to{transform:translateY(20px)}}
 .bar{height:8px;background:#222;animation:grow 2400ms linear forwards}
 @keyframes grow{from{width:0}to{width:300px}}
</style></head>
<body><div class="blob"></div><div class="bar"></div></body></html>
