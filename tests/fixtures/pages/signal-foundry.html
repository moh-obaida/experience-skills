<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal Foundry — authored reference example</title>
<style>
:root{font-family:system-ui,sans-serif;color:#1b2321;background:#f0f1ee;--line:#b8c2bd;--action:#174b46}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #0d6756;outline-offset:2px}header{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1rem 1.5rem;border-bottom:1px solid var(--line);background:#fff}header strong{letter-spacing:-.03em}header small{color:#4e5a56}main{display:grid;grid-template-columns:16rem minmax(0,1fr) 19rem;min-height:calc(100vh - 4rem)}nav,aside{padding:1.25rem;border-right:1px solid var(--line)}aside{border-right:0;border-left:1px solid var(--line)}nav a{display:block;padding:.65rem 0;color:inherit;text-decoration:none}nav a[aria-current]{font-weight:700}.workspace{padding:1.5rem;min-width:0}.status{display:flex;flex-wrap:wrap;gap:1rem;align-items:center;padding:.8rem 1rem;background:#fff;border:1px solid var(--line)}.status strong{color:#174b46}.head{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin:1.75rem 0 1rem}.head h1{font-size:1.75rem;line-height:1.15;margin:0}.primary{border:0;border-radius:4px;background:var(--action);color:white;padding:.7rem 1rem}.queue{background:#fff;border:1px solid var(--line)}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1rem;align-items:start;width:100%;padding:1rem;border:0;border-bottom:1px solid var(--line);background:#fff;color:inherit;text-align:left}.row:last-child{border:0}.row:hover{background:#f7faf8}.row[aria-pressed="true"]{box-shadow:inset 3px 0 #174b46}.row-title{display:block;font-size:1rem;font-weight:700;margin:0 0 .3rem}.row-desc,.meta{display:block;margin:0;color:#4e5a56;font-size:.88rem}.meta{font-variant-numeric:tabular-nums;white-space:nowrap}.detail-list{display:grid;grid-template-columns:auto 1fr;gap:.6rem 1rem;font-size:.9rem}.detail-list dt{color:#4e5a56}.detail-list dd{margin:0;font-weight:600}aside h2{font-size:1rem;margin-top:0}aside p{line-height:1.5}@media(max-width:980px){main{grid-template-columns:12rem minmax(0,1fr)}aside{grid-column:2;border-left:0;border-top:1px solid var(--line)}}@media(max-width:680px){main{display:block}nav{display:flex;gap:1rem;overflow:auto;border-right:0;border-bottom:1px solid var(--line);padding:.25rem 1rem}nav a{white-space:nowrap}.workspace{padding:1rem}aside{padding:1rem}.head{align-items:start;flex-direction:column}.row{grid-template-columns:1fr}.meta{white-space:normal}}
</style>
<header><strong>System status</strong><small>Updated 09:42 · Data live</small></header>
<main><nav aria-label="Sections"><a href="#queue" aria-current="page">Queue</a><a href="#details">Service detail</a></nav><section class="workspace" id="queue"><div class="status"><strong>2 need attention</strong><span>14 services reporting normally</span></div><div class="head"><h1>Priority queue</h1></div><div class="queue"><button class="row" aria-pressed="true" data-title="Payment webhook" data-state="Needs review" data-update="09:38" data-next="Inspect retry failures and confirm the delivery backlog before taking action."><span><span class="row-title">Payment webhook delayed</span><span class="row-desc">Retries are queued; delivery is 6 minutes behind.</span></span><span class="meta">09:38 · Needs review</span></button><button class="row" aria-pressed="false" data-title="Export worker" data-state="Monitoring" data-update="09:31" data-next="Capacity is recovering. Check the queue again before restarting work."><span><span class="row-title">Export job waiting</span><span class="row-desc">Worker capacity is recovering; no data has been lost.</span></span><span class="meta">09:31 · Monitoring</span></button></div></section><aside id="details"><h2 id="detail-title">Payment webhook</h2><dl class="detail-list"><dt>Status</dt><dd id="detail-state">Needs review</dd><dt>Updated</dt><dd id="detail-update">09:38</dd></dl><p id="detail-next">Inspect retry failures and confirm the delivery backlog before taking action.</p></aside></main><script>document.querySelectorAll(".row").forEach(row=>row.addEventListener("click",()=>{document.querySelectorAll(".row").forEach(other=>other.setAttribute("aria-pressed",String(other===row)));document.getElementById("detail-title").textContent=row.dataset.title;document.getElementById("detail-state").textContent=row.dataset.state;document.getElementById("detail-update").textContent=row.dataset.update;document.getElementById("detail-next").textContent=row.dataset.next;}));</script>
</html>
