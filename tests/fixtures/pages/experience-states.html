<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>State review (invented fixture)</title>
<style>*{box-sizing:border-box}body{font:16px/1.45 system-ui,sans-serif;color:#20251f;background:#f5f4ef;padding:24px;max-width:760px}.panel{background:white;border:1px solid #d2d6cf;padding:16px;margin:12px 0}.error{color:#922a20}.pill{display:inline-block;padding:4px 10px;border-radius:999px;background:#e5eee7}</style></head><body>
<h1>Room setup</h1>
<section class="panel" data-case="premature-error" data-benchmark="STA-01"><p class="error" role="alert">Add at least one player before continuing.</p><button>Continue</button></section>
<section class="panel" data-case="stale-error-after-correction" data-benchmark="STA-02"><label for="room">Room code</label><input id="room"><button id="validate">Check code</button><p id="room-error" class="error" role="alert" hidden>Room code must be four letters.</p></section>
<section class="panel" data-case="premature-success" data-benchmark="STA-03"><button id="save">Save changes</button><p id="save-status" role="status" hidden>Saved</p><span id="save-busy" aria-busy="false">Ready</span></section>
<section class="panel" data-case="irrelevant-empty-controls" data-benchmark="STA-04"><h2>No questions yet</h2><p>Import questions to start a game.</p><button>Sort by score</button><button>Filter by team</button></section>
<section class="panel" data-case="redundant-healthy-status" data-benchmark="STA-05"><span class="pill">Live connection</span><p>All players are connected.</p></section>
<section class="panel" data-case="positive-disconnected-status"><span class="error" role="status">Connection lost. Reconnecting…</span><button>Retry connection</button></section>
<script>
const room=document.querySelector('#room'), error=document.querySelector('#room-error');
document.querySelector('#validate').addEventListener('click',()=>{error.hidden=false;room.setAttribute('aria-invalid','true')});
room.addEventListener('input',()=>{if(/^[A-Za-z]{4}$/.test(room.value)){room.removeAttribute('aria-invalid');/* defect: stale message never clears */}});
document.querySelector('#save').addEventListener('click',()=>{const status=document.querySelector('#save-status'),busy=document.querySelector('#save-busy');status.hidden=false;busy.setAttribute('aria-busy','true');busy.textContent='Saving…';setTimeout(()=>{busy.setAttribute('aria-busy','false');busy.textContent='Ready'},900)});
</script></body></html>
